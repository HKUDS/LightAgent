common_tasks:
- Turn on/off Wi-Fi
- Toggle Bluetooth
- Check battery percentage and health
- Manage notifications for apps
- View and manage iCloud storage
- Set up or manage Family Sharing
- Configure Personal Hotspot
- Manage subscriptions
- Adjust Face ID settings
- Update software
known_limitations:
- Some settings require scrolling to find
- Search bar is hidden behind a gesture on some screens
- Certain options like VPN require prior configuration to appear
- Developer settings are hidden by default and need to be enabled
