common_tasks:
- View monthly calendar
- Add a new event
- Check today's schedule
- Switch between calendar views (month, day, year)
- Manage calendars (add, edit, toggle visibility)
- Set event reminders and alerts
- Invite people to an event
- Add event location
- Set repeating events
- Access inbox for event invitations
known_limitations:
- Some settings require scrolling to find
- Navigation between months may require multiple taps
