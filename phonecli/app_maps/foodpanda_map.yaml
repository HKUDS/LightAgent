launch_behavior: always_home
common_tasks:
- Search for restaurants or grocery stores
- Browse nearby restaurants and shops
- View restaurant menu and add items to cart
- Place a food delivery or pickup order
- Filter restaurants by cuisine, rating, or price
- Save restaurants or stores to favorites
- View and manage cart
- Check order history and track delivery
- Manage account settings, addresses, and payments
- Redeem vouchers and rewards
known_limitations:
- Some restaurant menus may have dismissible popups that interrupt browsing
- Filters and sorting options vary across different search screens
- Favorites management requires navigating to a separate tab
- Bottom navigation tabs may not be consistently labeled across all screens
