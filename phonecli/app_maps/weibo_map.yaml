launch_behavior: always_home
common_tasks:
- Browse the main feed for trending and followed posts
- Watch and share videos
- Search for trending topics and hot searches
- Post, repost, comment, and like content
- Manage notifications and privacy settings
- Discover new content via categories and recommendations
- Listen to podcasts and audio content
- Block or mute users and keywords
- View and edit personal profile
known_limitations:
- Some post options are hidden behind a 'more actions' menu
- Video playback controls may be obscured by interaction buttons
- Notification settings require navigating through multiple menus
- Keyword management for blocking is buried in the Shield feature
